# pomodoro-focus —— 番茄时钟静态站（方案 B：显式 location，最小变更面）
#
# 变更面：仅本文件 + sites-enabled/whatsapp-ai-hk 里一行 include
# 不引用、不改动任何既有 location；不用 alias；不用 try_files；不开 autoindex
# 部署目录：/var/www/pomodoro-focus/{index.html, assets/...}
#
# include 位置：443 server 块内 `listen 443 ssl;` 之前
#     include /etc/nginx/snippets/pomodoro-focus.conf;   # pomodoro-focus
#
# 回滚：
#     rm -f /etc/nginx/snippets/pomodoro-focus.conf
#     sed -i '/pomodoro-focus/d' /etc/nginx/sites-enabled/whatsapp-ai-hk
#     nginx -t && nginx -s reload
#     mv /var/www/pomodoro-focus /var/www/pomodoro-focus.rollback-$(date +%Y%m%d-%H%M%S)

# ① 无尾斜杠 → 301 补斜杠，保证 ./assets/... 相对路径解析到 /pomodoro-focus/assets/
location = /pomodoro-focus {
    return 301 /pomodoro-focus/;
}

# ② 前缀匹配；^~ 保证优先于正则 location（将来别人加的正则不会截走本站）
location ^~ /pomodoro-focus/ {
    # 显式指定，不依赖继承（本 server 块内另有 root /var/www/letsencrypt，属别的 server）
    root /var/www;
    index index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;

    # ③ assets 短缓存：零构建无 hash 文件名，300s 兼顾"改完别看到旧文件"与带宽
    # 内嵌只为分缓存；不新增任何对外路径，仍属上面这条 ^~ 前缀之内
    # 子块声明了 add_header，就不会继承父块的 no-cache，避免出现两个 Cache-Control
    location ^~ /pomodoro-focus/assets/ {
        root /var/www;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options nosniff;
    }
}
